legacy:
  website_title: SEC-bench
  website_subtitle: Can LLM Agents Solve Critical Security Challenges?
  section_title: Leaderboard
  section_description: 'Performance of LLM agents on security engineering tasks.'
  target_tabs:
    - name: poc_generation
      display_name: PoC Generation
      leaderboard: poc_generation
      status: available
      description: '<em>PoC Generation</em> evaluates agents on generating working security proof-of-concepts for real vulnerabilities.'
    - name: vulnerability_patching
      display_name: Vulnerability Patching
      leaderboard: vulnerability_patching
      status: available
      description: '<em>Vulnerability Patching</em> evaluates agents on producing patches for real security bugs.'
  leaderboards:
    - display_name: PoC Generation
      info_sections:
        - title: News
          content: |
            <ul>
              <li><span style="font-weight: bold;">[Dec 2025]:</span> <strong><a href="https://issues.oss-fuzz.com/issues" target="_blank">OSS-Fuzz</a></strong> instances are now integrated into SEC-bench!</li>
              <li><span style="font-weight: bold;">[Sep 2025]:</span> SEC-bench has been accepted to <strong><a href="https://nips.cc/Conferences/2025" target="_blank">NeurIPS 2025</a></strong>!</li>
              <li><span style="font-weight: bold;">[June 2025]:</span> We release the SEC-bench benchmark with <strong>PoC Generation</strong> and <strong>Vulnerability Patching</strong> tasks.</li>
            </ul>
        - title: SEC-bench Overview
          content: |
            SEC-bench is the first fully automated benchmarking framework for evaluating LLM agents on authentic security engineering tasks.
        - title: PoC Generation Task
          content: |
            PoC Generation evaluates the ability of LLM agents to craft proof-of-concept (PoC) artifacts that trigger specified vulnerabilities. A submission is considered successful only if it creates a working PoC artifact that triggers a valid sanitizer error.
            <br><br>
            <strong>Evaluation Modes:</strong>
            <br><br>
            SEC-bench supports three evaluation modes with varying levels of information provided to agents:
            <table class="mode-table">
              <thead>
                <tr>
                  <th>Mode</th>
                  <th>Information Provided</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><code class="mode-pill">poc-repo</code></td>
                  <td>Repository only</td>
                  <td>Agent receives only the vulnerable code. Must discover and validate the bug from scratch.</td>
                </tr>
                <tr>
                  <td><code class="mode-pill">poc-desc</code></td>
                  <td>Repository + Description</td>
                  <td>Agent receives repository plus high-level vulnerability description.</td>
                </tr>
                <tr>
                  <td><code class="mode-pill">poc-san</code></td>
                  <td>Repository + Description + Sanitizer Report</td>
                  <td>Agent receives all available information including crash stack trace.</td>
                </tr>
              </tbody>
            </table>
            <p><strong>Note:</strong> Current leaderboard results are evaluated using the <code class="mode-pill">poc-san</code> mode. Read more about evaluation modes in our <a href="https://hwiwonl.ee/blog/2025/sec-bench/" target="_blank" rel="noopener noreferrer">blog post</a>.</p>
      results:
        - model: OpenHands + Claude-3.7-Sonnet
          org: All Hands
