pro_common_info_sections: &pro_common_info_sections
  - title: News
    content: |
      <ul>
        <li><span style="font-weight: bold;">[June 17, 2026]:</span> Overall and Linux leaderboards are now built.</li>
        <li><span style="font-weight: bold;">[May 5, 2026]:</span> SpiderMonkey leaderboard has been released.</li>
        <li><span style="font-weight: bold;">[May 1, 2026]:</span> SEC-bench Pro launches with the V8 leaderboard.</li>
      </ul>

  - title: SEC-bench Pro Overview
    content: |
      SEC-bench Pro evaluates agents on vulnerability discovery and PoC generation tasks on challenging targets. Each target instance ships with a Docker image, metadata, a rendered prompt, and a harness. The harness renders the prompt from <code>meta.json</code>, starts the instance container, runs the configured agent with a timeout, and collects the generated files and run artifacts for checker evaluation.

